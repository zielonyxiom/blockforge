<line class="grid" x1="580.0" x2="580.0" y1="72" y2="262" stroke-width="1"/>
<text class="t3" x="580.0" y="282" font-size="11" text-anchor="middle">0.88</text>
<line class="grid" x1="690.0" x2="690.0" y1="72" y2="262" stroke-width="1"/>
<text class="t3" x="690.0" y="282" font-size="11" text-anchor="middle">1.00</text>
<text class="t1" x="236" y="102" font-size="13" text-anchor="end">Classic studs</text>
<text class="t3" x="236" y="117" font-size="11" text-anchor="end">integer sizes, 90° turns</text>
<path class="bar" d="M250 90 h308.4 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-308.4 z"><title>Classic studs: 0.85</title></path>
