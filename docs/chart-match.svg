<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img" aria-label="Silhouette match with the picture">
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7975}.grid{stroke:#e4e3df}.base{stroke:#b9b8b3}
  .bar{fill:#2a78d6}.track{fill:#eef0f2}.box{fill:#ffffff;stroke:#d6d5d0}.acc{fill:#2a78d6}.arrow{stroke:#9b9a95;fill:none}
  text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9a998f}.grid{stroke:#33332f}.base{stroke:#57564f}
    .bar{fill:#3987e5}.track{fill:#262624}.box{fill:#232322;stroke:#3d3d39}.acc{fill:#3987e5}.arrow{stroke:#77766e}}
</style>
<rect class="bg" width="760" height="308" rx="12"/>
<text class="t1" x="24" y="34" font-size="18" font-weight="600">Silhouette match with the picture</text>
<text class="t2" x="24" y="56" font-size="13">Front IoU between the model rendered from the picture’s camera and the picture (1.0 = identical)</text>
<line class="grid" x1="250.0" x2="250.0" y1="72" y2="262" stroke-width="1"/>
<text class="t3" x="250.0" y="282" font-size="11" text-anchor="middle">0.50</text>
<line class="grid" x1="360.0" x2="360.0" y1="72" y2="262" stroke-width="1"/>
<text class="t3" x="360.0" y="282" font-size="11" text-anchor="middle">0.62</text>
<line class="grid" x1="470.0" x2="470.0" y1="72" y2="262" stroke-width="1"/>
