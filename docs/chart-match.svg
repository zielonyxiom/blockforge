<text class="t1" x="236" y="148" font-size="13" text-anchor="end">House style</text>
<text class="t3" x="236" y="163" font-size="11" text-anchor="end">free sizes, organic tilts</text>
<path class="bar" d="M250 136 h348.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-348.0 z"><title>House style: 0.90</title></path>
