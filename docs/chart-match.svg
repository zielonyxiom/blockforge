<text class="t3" x="236" y="209" font-size="11" text-anchor="end">full depth, back + roots</text>
<path class="bar" d="M250 182 h330.4 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-330.4 z"><title>House style, all sides: 0.88</title></path>
